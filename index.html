<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date with Luyna</title>
    <meta name="description" content="Date with Luyna — 01 · 08 · 2026 · Times City">

    <!-- Ảnh preview khi gửi link qua Messenger / Zalo / Facebook.
         og:image BẮT BUỘC là URL tuyệt đối, đường dẫn tương đối sẽ không hiện ảnh.
         Đổi BASE_URL bên dưới nếu bạn deploy ở tên miền khác. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Date with Luyna">
    <meta property="og:locale" content="vi_VN">
    <meta property="og:url" content="https://congtiendev.github.io/Date-With-Luyna-1-8-2026/">
    <meta property="og:title" content="Date with Luyna">
    <meta property="og:description" content="Một buổi hẹn thật đặc biệt — 01 · 08 · 2026 · Times City">
    <meta property="og:image" content="https://congtiendev.github.io/Date-With-Luyna-1-8-2026/assets/img/preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Date with Luyna">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Date with Luyna">
    <meta name="twitter:description" content="Date with Luyna — 01 · 08 · 2026 · Times City">
    <meta name="twitter:image" content="https://congtiendev.github.io/Date-With-Luyna-1-8-2026/assets/img/preview.png">

    <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

    <link rel="preload" as="image" href="assets/img/envelope-back.png">
    <link rel="preload" as="image" href="assets/img/envelope-flap.png">
    <link rel="preload" as="image" href="assets/img/flowers.png">
    <link rel="preload" as="image" href="assets/img/letter.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind.config.js"></script>
</head>
<body
    class="relative min-h-screen overflow-hidden bg-black font-body text-white antialiased"
>

    <!-- Video nền -->
    <video
        id="bg-video"
        class="fixed inset-0 -z-20 h-full w-full object-cover"
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
    ></video>

    <!-- Nhạc nền: chỉ phát sau khi bấm "Khám phá" nên trình duyệt cho phép có tiếng -->
    <audio id="bg-music" src="assets/audio/music.mp3" loop preload="auto"></audio>

    <!-- Phong thư rơi xuống khi video kết thúc.
         Toạ độ từng lớp được tính từ vùng nội dung thật của mỗi file PNG:
           envelope-back  x 304-1230, y 218-878  (926x660) -> hệ quy chiếu, khung #env-move
           envelope-flap  x 224-1320, y 170-556 (1097x387) — cắt từ envelope-flap-source.png,
                          bỏ dải chữ nhật y 558-808 chỉ giữ tam giác, rồi kéo cao 148.55%
                          để đỉnh chữ V sâu ~56% thân phong bì như envelope-closed.png;
                          nếu không nếp gấp sẵn có của thân sẽ nhô ra thành hai chữ V.
           flowers   x 172-1414, y  70-950  (1242x880)
           letter    x  48- 974, y 146-1342 (927x1197, canvas 1024x1536)
                     viền hồng x 86-937, y 182-1305; hoa lấn 4 góc, dải giữa y 540-947 trống
    -->
    <div class="pointer-events-none fixed inset-0 z-10 flex items-center justify-center">
        <div id="env-drop" class="opacity-0 will-change-transform">
            <div
                id="env-move"
                class="relative aspect-[926/660] transition-transform duration-[1500ms] ease-[cubic-bezier(.4,0,.2,1)] [perspective:1200px]"
                style="width: var(--env-w)"
            >
                <!-- Thân phong bì (khớp đúng khung) -->
                <img
                    src="assets/img/envelope-back.png" alt="" draggable="false" data-paper
                    class="absolute left-0 top-0 w-[165.87%] max-w-none transition-opacity duration-700"
                    style="transform: translate(-19.792%, -21.289%)"
                >

                <!-- Nắp thư: bản lề nằm ở cạnh trên thân phong bì.
                     Ảnh vẽ đỉnh hướng lên = tư thế đã mở, nên đóng = rotateX(180deg). -->
                <img
                    id="flap"
                    src="assets/img/envelope-flap.png" alt="" draggable="false" data-paper
                    class="absolute left-0 top-0 w-[140.018%] max-w-none transition-all duration-[1100ms] ease-[cubic-bezier(.33,1.1,.4,1)]"
                    style="height: 148.55%; transform: translate(-14.583%, -54.297%) rotateX(180deg); transform-origin: 50% 54.297%"
                >

                <!-- Hoa: lớp trang trí nằm trên nắp -->
                <img
                    src="assets/img/flowers.png" alt="" draggable="false" data-paper
                    class="absolute left-0 top-0 w-[155.45%] max-w-none transition-opacity duration-700"
                    style="transform: translate(-18.42%, -24.13%)"
                >

                <!-- Vùng cắt: đáy trùng miệng phong bì, thư trồi lên từ đây -->
                <div id="letter-clip" class="absolute bottom-full left-0 h-[400%] w-full overflow-hidden">
                    <div
                        id="letter"
                        class="absolute bottom-0 left-1/2 aspect-[927/1197] w-[70%] transition-transform duration-[1500ms] ease-[cubic-bezier(.4,0,.2,1)]"
                        style="transform: translate(-50%, 100%); font-size: calc(var(--env-w) * .0278)"
                    >
                        <img
                            src="assets/img/letter.png" alt="" draggable="false"
                            class="absolute left-0 top-0 w-[110.464%] max-w-none"
                            style="transform: translate(-4.688%, -9.505%)"
                        >
                        <!-- Chữ đè bằng HTML nên luôn sắc nét và đủ dấu tiếng Việt.
                             Vùng chữ né 4 cụm hoa ở góc: hoa lấn tới x≈436 bên trái và x≈745
                             bên phải ở phần trên/dưới, nên chừa 13% mỗi bên và 28% trên/dưới. -->
                        <div class="absolute bottom-[26%] left-[12%] right-[12%] top-[26%] flex flex-col items-center justify-center text-center text-[#6b5747]">
                            <h2 class="font-display text-[1.35em] italic leading-tight">Gửi Luyna,</h2>
                            <span class="mt-[.75em] block w-[2.4em] shrink-0 rounded-full bg-[#cba98a]" style="height:.09em"></span>

                            <div class="mt-[.75em] grid grid-cols-[auto_1fr] items-baseline gap-x-[.85em] gap-y-[.38em] text-left">
                                <span class="font-display text-[.72em] tracking-[.12em] text-[#b0836f]">19:00</span>
                                <span class="text-[.95em] leading-snug">Anh đón em</span>

                                <span class="font-display text-[.72em] tracking-[.12em] text-[#b0836f]">19:00</span>
                                <span class="text-[.95em] leading-snug line-through decoration-[#b0836f] decoration-[0.06em]">Ăn tối</span>
  
                                <span class="font-display text-[.72em] tracking-[.12em] text-[#b0836f]">20:00</span>
                                <span class="text-[.95em] leading-snug">Xem phim Spider-Man: Brand New Day</span>

                                <span class="font-display text-[.72em] tracking-[.12em] text-[#b0836f]">23:00</span>
                                <span class="text-[.95em] leading-snug">Anh đưa em về nhà</span>
                            </div>

                            <span class="mt-[.85em] block w-[2.4em] shrink-0 rounded-full bg-[#cba98a]" style="height:.09em"></span>
                            <p class="mt-[.55em] font-display text-[.66em] uppercase tracking-[.3em]">Times City</p>
                            <p class="mt-[.25em] text-[.8em] italic text-[#9c8770]">01 · 08 · 2026</p>
                            <!-- Đếm ngược: 4 ô số, mỗi ô có nhãn đơn vị bên dưới -->
                            <div id="countdown" class="mt-[.6em] flex items-start justify-center gap-[.75em] text-[#b0836f]">
                                <span class="flex flex-col items-center leading-none">
                                    <span id="cd-d" class="font-display text-[1em] tracking-[.05em]">--</span>
                                    <span class="mt-[.45em] text-[.4em] uppercase tracking-[.22em] text-[#c0a189]">ngày</span>
                                </span>
                                <span class="flex flex-col items-center leading-none">
                                    <span id="cd-h" class="font-display text-[1em] tracking-[.05em]">--</span>
                                    <span class="mt-[.45em] text-[.4em] uppercase tracking-[.22em] text-[#c0a189]">giờ</span>
                                </span>
                                <span class="flex flex-col items-center leading-none">
                                    <span id="cd-m" class="font-display text-[1em] tracking-[.05em]">--</span>
                                    <span class="mt-[.45em] text-[.4em] uppercase tracking-[.22em] text-[#c0a189]">phút</span>
                                </span>
                                <span class="flex flex-col items-center leading-none">
                                    <span id="cd-s" class="font-display text-[1em] tracking-[.05em]">--</span>
                                    <span class="mt-[.45em] text-[.4em] uppercase tracking-[.22em] text-[#c0a189]">giây</span>
                                </span>
                            </div>
                            <p id="countdown-done" class="mt-[.6em] hidden font-display text-[.7em] uppercase tracking-[.25em] text-[#b0836f]">
                                Đã đến giờ hẹn
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hộp thoại dùng chung cho cả hai bước hỏi -->
    <div
        id="dialog-layer"
        class="pointer-events-none fixed inset-0 z-30 flex items-center justify-center px-6 opacity-0 transition-opacity duration-500"
    >
        <div class="absolute inset-0 bg-black/60 backdrop-blur-[3px]"></div>

        <!-- Giấy kem + khung viền hồng đôi, cùng tông với lá thư -->
        <div
            id="dialog"
            class="relative w-full max-w-[23rem] scale-95 bg-[#fdfaf3] p-[10px] text-center text-[#6b5747] shadow-[0_30px_70px_-20px_rgba(0,0,0,.75)] transition-transform duration-500 ease-[cubic-bezier(.2,.9,.3,1)]"
        >
            <div class="border border-[#e7c3b1] px-7 py-9">
                <span class="mx-auto block h-[2px] w-9 rounded-full bg-[#cba98a]"></span>
                <p id="dialog-text" class="mt-6 font-display text-lg italic leading-snug sm:text-xl"></p>
                <div id="dialog-actions" class="mt-8 flex flex-wrap justify-center gap-3"></div>
            </div>
        </div>
    </div>

    <p
        id="hint"
        class="pointer-events-none fixed bottom-10 left-1/2 z-20 -translate-x-1/2 font-display text-[10px] uppercase tracking-[.4em] text-white opacity-0 drop-shadow-[0_2px_5px_rgba(0,0,0,.8)] transition-opacity duration-1000 sm:text-xs"
    >
        Chạm để mở thư
    </p>

    <div
        id="intro"
        class="container mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center px-6 text-center transition-opacity duration-1000"
    >
        <h1 class="animate-fade-up font-display text-5xl font-medium italic leading-tight tracking-wide drop-shadow-lg sm:text-7xl md:text-8xl">
            Date with Luyna
        </h1>

        <div class="animate-fade-up mt-8 flex items-center gap-4 drop-shadow-[0_2px_5px_rgba(0,0,0,.75)]" style="animation-delay: .15s">
            <span class="h-px w-12 bg-white/80 sm:w-20"></span>
            <span class="font-display text-sm uppercase tracking-[0.45em] text-white sm:text-base">01 · 08 · 2026</span>
            <span class="h-px w-12 bg-white/80 sm:w-20"></span>
        </div>


        <button
            id="play-btn"
            type="button"
            class="animate-fade-up mt-12 rounded-none border border-white/70 bg-black/25 px-10 py-4 font-display text-xs uppercase tracking-[0.35em] backdrop-blur-sm transition duration-300 hover:bg-white hover:text-black sm:text-sm"
            style="animation-delay: .45s"
        >
            Khám phá
        </button>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
